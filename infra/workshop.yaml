AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Hermes and Jarvis workshop host - one EC2 instance with IAM-authenticated
  Amazon Bedrock and Session Manager access, with no inbound ports.

# Adapted from JiaDe-Wu/sample-hermes-agent-on-aws-with-bedrock,
# commit c9c5a46654e97d45c8bfb6f6f4ec66852cbe0f2b (MIT).
# Supported deployment Region: us-east-1. The workshop CLI checks this before
# creating a stack. Bootstrap verifies it again before installing packages.
# Intended for fresh, disposable workshop stacks. To change bootstrap versions,
# delete and recreate the stack after saving any files you want to keep.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: One outbound-connected Ubuntu host; CLI installs the private Jarvis interface afterward.
    must:
      - Deploy only in us-east-1; the workshop CLI must enforce the Region before creation.
      - No public inbound ports, static AWS keys, model calls during bootstrap, or retained workshop disks.
      - Use fresh stacks; wait-condition handles must not be reused for a new bootstrap run.

Resources:
  HermesWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
    Metadata:
      com.aws.cloudformation.Context:
        why: temporary signed destination for a bootstrap result without extra IAM permissions
        must:
          - Do not reuse this handle for a later instance replacement or stack update.

  HermesWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: HermesInstance
    Metadata:
      com.aws.cloudformation.Context:
        why: report installation failures and allow package setup under standard CPU credits
        must:
          - Signal success only after package, CLI, and local SSM service checks pass.
          - A missing signal must time out; verify SSM Online separately after stack creation.
    Properties:
      Handle: !Ref HermesWaitHandle
      Timeout: '1800'
      Count: 1

  HermesVPC:
    Type: AWS::EC2::VPC
    Metadata:
      com.aws.cloudformation.Context:
        why: isolated workshop network that can be deleted without touching an existing VPC
        must:
          - Keep DNS resolution enabled for package downloads and AWS service endpoints.
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Metadata:
      com.aws.cloudformation.Context:
        why: outbound internet access without a paid NAT gateway or interface endpoints
        must:
          - Instance security-group ingress must remain empty.

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Metadata:
      com.aws.cloudformation.Context:
        why: connect the workshop's own internet gateway to its own VPC
        must:
          - The default route must wait for this attachment.
    Properties:
      VpcId: !Ref HermesVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Metadata:
      com.aws.cloudformation.Context:
        why: one subnet is sufficient for a single disposable host
        must:
          - Give the host outbound connectivity; never infer that a public IP allows ingress.
    Properties:
      VpcId: !Ref HermesVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Metadata:
      com.aws.cloudformation.Context:
        why: keep workshop routing independent of any existing network
        must:
          - Associate this table with the workshop subnet before instance bootstrap.
    Properties:
      VpcId: !Ref HermesVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Metadata:
      com.aws.cloudformation.Context:
        why: packages, Session Manager, and Bedrock need outbound access
        must:
          - Route through the attached workshop internet gateway.
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: make the outbound route effective before cloud-init runs
        must:
          - The instance must depend on this association and the default route.
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  HermesInstanceRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: temporary EC2 credentials for Session Manager and the single workshop model
        must:
          - Only EC2 may assume this role; never place AWS access keys on disk.
          - Invocation must be limited to Nova Micro and its three US inference destinations.
          - Within the inline Bedrock policy, wildcard resources are permitted only for discovery list operations.
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
      Policies:
        - PolicyName: NovaMicroWorkshop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-micro-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-micro-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-micro-v1:0'
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: '*'
              - Effect: Allow
                Action: bedrock:GetFoundationModel
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-micro-v1:0'
                  - !Sub 'arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-micro-v1:0'
              - Effect: Allow
                Action: bedrock:GetInferenceProfile
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-micro-v1:0'

  HermesInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Metadata:
      com.aws.cloudformation.Context:
        why: deliver renewable role credentials through EC2 instance metadata
        must:
          - Attach only the workshop role.
    Properties:
      Roles: [!Ref HermesInstanceRole]

  HermesSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Session Manager initiates outbound connections; the UI uses a local forwarding session
        must:
          - Keep ingress empty; do not add SSH or application ports.
          - Only the workshop instance uses this security group.
    Properties:
      GroupDescription: Workshop host with outbound access and no inbound rules
      VpcId: !Ref HermesVPC
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  HermesInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - SubnetRouteTableAssociation
    Metadata:
      com.aws.cloudformation.Context:
        why: a small host runs Hermes; a public IPv4 address avoids NAT and endpoint hourly charges
        must:
          - Require IMDSv2 and standard CPU credits.
          - Encrypt the root disk and delete it and the primary network interface with the instance.
          - Keep the model/provider configuration compatible with the role's Nova Micro permissions.
          - No model request, messaging gateway, or Jarvis service starts during bootstrap.
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id}}'
      InstanceType: t3.small
      IamInstanceProfile: !Ref HermesInstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      CreditSpecification:
        CPUCredits: standard
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeleteOnTermination: true
          DeviceIndex: '0'
          GroupSet: [!Ref HermesSecurityGroup]
          SubnetId: !Ref PublicSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          umask 077
          exec > >(tee /var/log/hermes-setup.log) 2>&1

          # No cfn-bootstrap package is needed. Python is part of the Ubuntu
          # cloud image; this also works when apt or pip installation fails.
          signal_result() {
            python3 - '${HermesWaitHandle}' "$1" <<'SIGNAL_PY'
          import json
          import sys
          import time
          import urllib.request

          status = sys.argv[2]
          payload = {
              "Status": status,
              "Reason": "Hermes bootstrap completed" if status == "SUCCESS" else "Hermes bootstrap failed; inspect /var/log/hermes-setup.log",
              "UniqueId": "hermesbootstrap",
              "Data": "Local checks only; no model request was sent.",
          }
          request = urllib.request.Request(
              sys.argv[1], data=json.dumps(payload).encode(),
              headers={"Content-Type": ""}, method="PUT",
          )
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      response.read()
                  sys.exit(0)
              except Exception:
                  # Never print the temporary signed URL or its credentials.
                  if attempt < 3:
                      time.sleep(2)
          print("Could not deliver the bootstrap signal; CloudFormation will time out.", file=sys.stderr)
          sys.exit(1)
          SIGNAL_PY
          }

          on_exit() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ]; then
              echo "Bootstrap failed with exit code $result."
              signal_result FAILURE || true
            fi
            exit "$result"
          }
          trap on_exit EXIT

          [ '${AWS::Region}' = 'us-east-1' ] || {
            echo 'This workshop supports us-east-1 only.'
            exit 1
          }
          export DEBIAN_FRONTEND=noninteractive
          export AWS_REGION=us-east-1
          export AWS_DEFAULT_REGION=us-east-1

          echo '[1/5] Installing operating-system dependencies...'
          apt-get update -qq
          apt-get install -y -qq python3-venv python3-dev python3-pip git curl unzip xz-utils

          echo '[2/5] Installing the official AWS CLI...'
          cli_dir=$(mktemp -d)
          curl --fail --show-error --silent --location --retry 3 --connect-timeout 10 --max-time 300 \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$cli_dir/awscliv2.zip"
          unzip -q "$cli_dir/awscliv2.zip" -d "$cli_dir"
          "$cli_dir/aws/install" --update
          rm -rf "$cli_dir"

          echo '[3/5] Starting the preinstalled Systems Manager agent...'
          snap start amazon-ssm-agent 2>/dev/null || systemctl start amazon-ssm-agent
          systemctl is-active --quiet snap.amazon-ssm-agent.amazon-ssm-agent.service || \
            systemctl is-active --quiet amazon-ssm-agent.service

          echo '[4/5] Installing the pinned Hermes runtime...'
          sudo -H -u ubuntu env AWS_REGION=us-east-1 AWS_DEFAULT_REGION=us-east-1 bash <<'HERMES_INSTALL'
          set -Eeuo pipefail
          umask 077
          cd ~
          python3 -m venv ~/hermes-venv
          source ~/hermes-venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'hermes-agent==0.19.0' 'boto3==1.44.6'

          cat >> ~/.bashrc <<'SHELL_CONFIG'

          # Workshop Hermes environment. AWS credentials come from the EC2 role.
          source ~/hermes-venv/bin/activate
          export AWS_REGION=us-east-1
          export AWS_DEFAULT_REGION=us-east-1
          SHELL_CONFIG

          mkdir -p ~/.hermes
          chmod 700 ~/.hermes
          cat > ~/.hermes/config.yaml <<'HERMES_CONFIG'
          model:
            default: us.amazon.nova-micro-v1:0
            provider: bedrock
            base_url: https://bedrock-runtime.us-east-1.amazonaws.com
          bedrock:
            region: us-east-1
            discovery:
              enabled: true
          agent:
            max_turns: 3
          approvals:
            mode: manual
          terminal:
            backend: local
            cwd: .
            timeout: 180
          memory:
            memory_enabled: true
            user_profile_enabled: true
          compression:
            enabled: true
            threshold: 0.50
          display:
            streaming: true
          HERMES_CONFIG
          chmod 600 ~/.hermes/config.yaml
          printf '%s\n' us-east-1 > ~/.hermes/region.txt

          # Imports/version checks and CLI help do not invoke a model.
          python - <<'CHECK_RUNTIME'
          import boto3
          from importlib.metadata import version
          assert version("hermes-agent") == "0.19.0"
          assert version("boto3") == "1.44.6"
          CHECK_RUNTIME
          hermes --help >/dev/null
          HERMES_INSTALL

          echo '[5/5] Local checks passed; signaling CloudFormation...'
          signal_result SUCCESS
          trap - EXIT
          echo 'Hermes bootstrap complete. Jarvis is installed separately by the workshop CLI.'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-instance'

Outputs:
  InstanceId:
    Description: Workshop EC2 instance used by the CLI for Session Manager and Jarvis installation
    Value: !Ref HermesInstance
  SecurityGroupId:
    Description: Workshop security group; its inbound-rule list must remain empty
    Value: !Ref HermesSecurityGroup
  InstanceRoleArn:
    Description: EC2 role limited to Session Manager and Amazon Nova Micro
    Value: !GetAtt HermesInstanceRole.Arn
  InstanceProfileArn:
    Description: Instance profile that supplies renewable credentials to the host
    Value: !GetAtt HermesInstanceProfile.Arn
  SessionManagerCommand:
    Description: Run with the AWS CLI profile used for this workshop
    Value: !Sub 'aws ssm start-session --target ${HermesInstance} --region us-east-1'
  BedrockModel:
    Description: Workshop inference profile; requests are billed separately from EC2
    Value: us.amazon.nova-micro-v1:0
  Region:
    Description: Deployment Region; only us-east-1 is supported by this workshop
    Value: !Ref AWS::Region
